name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The build tasks load the VSTO runtime, which the runner image doesn't include.
      - name: Install VSTO runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/vstor-redist -OutFile vstor_redist.exe
          "DBG size " + (Get-Item vstor_redist.exe).Length
          "DBG head " + (Get-Content vstor_redist.exe -TotalCount 3 -Encoding Byte -ErrorAction SilentlyContinue | Out-String)
          "DBG text " + ((Get-Content vstor_redist.exe -TotalCount 5 -ErrorAction SilentlyContinue) -join " | ").Substring(0,200)
          Start-Process .\vstor_redist.exe -ArgumentList "/q","/norestart" -Wait
          Remove-Item vstor_redist.exe

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
