name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe bootstrapper (temporary)
        shell: pwsh
        run: |
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\ClickOnce Bootstrapper\Packages\VSTOR40" -Recurse | ForEach-Object { 'DBG file ' + $_.FullName + ' ' + $_.Length }
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\ClickOnce Bootstrapper\Packages\VSTOR40" -Recurse -Filter *.xml | ForEach-Object { Select-String -Path $_.FullName -Pattern 'http|PackageFile|HomeSite' | ForEach-Object { 'DBG xml ' + $_.Line.Trim() } }

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
