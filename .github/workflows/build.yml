name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe runtime sources (temporary)
        shell: pwsh
        run: |
          curl.exe -sL https://aka.ms/vstor-redist -o r.html
          Select-String -Path r.html -Pattern 'https?://\S+' -AllMatches | ForEach-Object { $_.Matches.Value } | Sort-Object -Unique | Where-Object { $_ -match 'exe|vstor|redist' } | ForEach-Object { 'DBG link ' + $_ }
          $vw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vw -latest -products * -include packages -format json | Out-File pk.json
          Select-String -Path pk.json -Pattern '"id": "[^"]*(VSTO|Office)[^"]*"' | ForEach-Object { 'DBG pkg ' + $_.Matches.Value }

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
