name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The VSTO build tasks load the VSTO runtime, which the runner image doesn't install.
      # The link is the one in Visual Studio's own VSTOR40 bootstrapper package.
      - name: Install VSTO runtime
        shell: pwsh
        run: |
          curl.exe -sSL "https://go.microsoft.com/fwlink/?LinkId=158918" -o vstor_redist.exe
          $head = [System.IO.File]::ReadAllBytes("vstor_redist.exe")[0..1]
          if ([System.Text.Encoding]::ASCII.GetString($head) -ne "MZ") { throw "The VSTO runtime download is not an installer." }
          $p = Start-Process .\vstor_redist.exe -ArgumentList "/q","/norestart" -Wait -PassThru
          "VSTO runtime installer exit code: " + $p.ExitCode
          Remove-Item vstor_redist.exe

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
