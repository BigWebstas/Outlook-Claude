name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find VSTO assemblies (temporary)
        shell: pwsh
        run: |
          foreach ($root in "C:\Windows\Microsoft.NET\assembly","C:\Windows\assembly","C:\Program Files (x86)\Microsoft Visual Studio","C:\Program Files\Microsoft Visual Studio","C:\Program Files (x86)\Common Files\Microsoft Shared\VSTO") {
            if (Test-Path $root) { Get-ChildItem $root -Recurse -Include "Microsoft.Office.Tools*.dll","Microsoft.VisualStudio.Tools.Applications.Runtime.dll","office.dll" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } }
          }

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
