name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The VSTO build tasks load the VSTO runtime, which the runner image doesn't install. Visual Studio ships its installer.
      - name: Install VSTO runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\ClickOnce Bootstrapper\Packages\VSTOR40" -Recurse -Filter vstor_redist.exe | Select-Object -First 1
          if (-not $installer) { throw "vstor_redist.exe not found in the ClickOnce Bootstrapper packages." }
          Start-Process $installer.FullName -ArgumentList "/q","/norestart" -Wait

      # Builds the classic Outlook add-in with a throwaway signing certificate and checks the Office add-in manifest.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path outlook-vsto/bin/Release/* -DestinationPath claude-mail-sorter-outlook-classic.zip
          Compress-Archive -Path outlook/* -DestinationPath claude-mail-sorter-outlook-office-addin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-addins
          path: "*.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME claude-mail-sorter-outlook-classic.zip claude-mail-sorter-outlook-office-addin.zip --generate-notes
